  // Dust lanes hug the mid-plane: they absorb and redden.
  float dn = fbm(d * 7.5 + vec3(warp * 1.5), 5);
  float dust = smoothstep(-0.05, 0.4, dn + 0.25 * fbm(d * 19.0, 3)) * exp(-b * b * 3.5);
  vec3 starlight = mix(blackbody(4800.0), blackbody(8500.0), clamp(0.5 + 1.2 * fbm(d * 3.7 + vec3(9.0), 3), 0.0, 1.0));
  vec3 c = starlight * glow * exp(-vec3(1.6, 2.3, 3.2) * dust);
  // Faint emission nebulae (Hα) along the plane and a touch of blue reflection.
  float ha = pow(max(fbm(d * 11.0 + vec3(5.5), 4) - 0.18, 0.0), 2.0) * exp(-b * b * 2.0);
  float refl = pow(max(fbm(d * 8.0 + vec3(-4.0, 2.0, 7.0), 4) - 0.22, 0.0), 2.0) * exp(-b * b * 1.2);
  c += vec3(1.0, 0.22, 0.30) * ha * 2.2 + vec3(0.35, 0.55, 1.0) * refl * 1.2;
  // Very faint isotropic background (unresolved stars / zodiacal floor).
  return c * 0.024 + blackbody(5200.0) * 0.0004;
}

void main() {
  vec2 st = gl_FragCoord.xy / uFace.y * 2.0 - 1.0;
  int f = int(uFace.x + 0.5);
  vec3 d;
  // Standard cubemap face orientation (+X, −X, +Y, −Y, +Z, −Z).
  if (f == 0) d = vec3(1.0, -st.y, -st.x);
  else if (f == 1) d = vec3(-1.0, -st.y, st.x);
  else if (f == 2) d = vec3(st.x, 1.0, st.y);
  else if (f == 3) d = vec3(st.x, -1.0, -st.y);
  else if (f == 4) d = vec3(st.x, -st.y, 1.0);
  else d = vec3(-st.x, -st.y, -1.0);
  d = normalize(d);
  vec3 c = milkyWay(d);
  c += starLayer(d, 150.0, 0.30, 0.012, 0.16, uFace.z, 53u, 1.0);   // ≈ 60 k unresolved stars confined to the galactic band
  fragColor = vec4(c, 1.0);
}
`;

/* ════════════════════════════════════════════════════════════════════════════
   4. WEBGPU RENDERER
   Frame graph:
     [trace  (compute)]   geodesics → ray cache          only when the camera/spin changed
     [static (render) ]   time-independent shading of the freshly traced band → S0, running mean S̄, sky cache
     shade               ray cache → animated HDR frame  every frame
     resolve             upsample + temporal accumulation
     bloom               multi-scale glare
     composite           exposure, tone curve (HDR shoulder | AgX), grain → canvas
   ════════════════════════════════════════════════════════════════════════════ */
const BLOOM_LEVELS = 6;
const UNIFORM_FLOATS = 19 * 4;

class WebGPURenderer {
  static async create(canvas) {
    if (!navigator.gpu) throw new Error('navigator.gpu is not available');
    const adapter = await navigator.gpu.requestAdapter({ powerPreference: 'high-performance' });
    if (!adapter) throw new Error('no WebGPU adapter');
    // The full-resolution ray cache is 64 bytes per pixel: ask for large storage buffers.
    const GiB = 1073741824;
    const requiredLimits = {
      maxStorageBufferBindingSize: Math.min(adapter.limits.maxStorageBufferBindingSize, GiB),
      maxBufferSize: Math.min(adapter.limits.maxBufferSize, GiB),
    };
    const device = await adapter.requestDevice({ requiredLimits });
    const context = canvas.getContext('webgpu');
    if (!context) throw new Error('no webgpu canvas context');
    const r = new WebGPURenderer(canvas, device, context);
    await r.init();
    return r;
  }

  constructor(canvas, device, context) {
    this.kind = 'webgpu';
    this.label = 'WebGPU';
    this.supportsSupersample = true;
    this.canvas = canvas;
    this.device = device;
    this.context = context;
    this.hdr = false;
    this.maxCachePixels = Math.floor(Math.min(device.limits.maxStorageBufferBindingSize, device.limits.maxBufferSize) / 64);
    this.maxTextureSize = device.limits.maxTextureDimension2D;
    this.histIndex = 0;
    this.onError = null;
    device.addEventListener('uncapturederror', (e) => { console.error('WebGPU error:', e.error.message); if (this.onError) this.onError(e.error.message); });
    device.lost.then((info) => { if (this.onError) this.onError('GPU device lost: ' + info.message); });
  }

  /** Configure the canvas: rgba16float + Display-P3; "extended" tone mapping lets values above 1.0
      exceed SDR white on an HDR display.  Falls back step by step on browsers that lack
      canvas tone-mapping control or float canvases.  Returns whether HDR output is active. */
  setHDR(on) {
    const base = { device: this.device, format: this.canvasFormat, colorSpace: 'display-p3', alphaMode: 'opaque' };
    this.hdr = false;
    if (this.canvasFormat === 'rgba16float') {
      try {
        this.context.configure({ ...base, toneMapping: { mode: on ? 'extended' : 'standard' } });
        const got = this.context.getConfiguration ? this.context.getConfiguration() : null;
        this.hdr = on && (!got || !got.toneMapping || got.toneMapping.mode === 'extended');
        return this.hdr;
      } catch (e) { /* no toneMapping member: configure without it below */ }
    }
    this.context.configure(base);
    return this.hdr;
  }

  /** rgba16float if the canvas accepts it, otherwise the preferred 8-bit format (SDR only). */
  pickCanvasFormat() {
    try {
      this.context.configure({ device: this.device, format: 'rgba16float', colorSpace: 'display-p3', alphaMode: 'opaque' });
      return 'rgba16float';
    } catch (e) {
      return navigator.gpu.getPreferredCanvasFormat();
    }
  }

  async init() {
    const d = this.device;
    this.canvasFormat = this.pickCanvasFormat();
    const F = GPUShaderStage.FRAGMENT, C = GPUShaderStage.COMPUTE;
    const tex = (binding, viewDimension = '2d') => ({ binding, visibility: F, texture: { sampleType: 'float', viewDimension } });
    const smp = (binding) => ({ binding, visibility: F, sampler: { type: 'filtering' } });
    const ubo = (binding, visibility) => ({ binding, visibility, buffer: { type: 'uniform' } });

    this.layouts = {
      trace: d.createBindGroupLayout({ entries: [ubo(0, C), { binding: 1, visibility: C, buffer: { type: 'storage' } }] }),
      shade: d.createBindGroupLayout({ entries: [ubo(0, F), { binding: 1, visibility: F, buffer: { type: 'read-only-storage' } },
        tex(2), smp(3), tex(4, '3d'), smp(5), tex(6, 'cube'), tex(7), tex(8), tex(9)] }),
      stat: d.createBindGroupLayout({ entries: [ubo(0, F), { binding: 1, visibility: F, buffer: { type: 'read-only-storage' } },
        tex(2), smp(3), tex(4, '3d'), smp(5), tex(6, 'cube')] }),
      post: d.createBindGroupLayout({ entries: [ubo(0, F), tex(1), tex(2), smp(3)] }),
      sky: d.createBindGroupLayout({ entries: [ubo(0, F), tex(1), smp(2), tex(3, '3d'), smp(4)] }),
    };
    const pl = (l) => d.createPipelineLayout({ bindGroupLayouts: [l] });
    const module = async (name, code) => {
      const m = d.createShaderModule({ label: name, code });
      const info = await m.getCompilationInfo();
      for (const msg of info.messages) if (msg.type === 'error') throw new Error(`${name} shader: ${msg.message} (line ${msg.lineNum})`);
      return m;
    };
    const mTrace = await module('trace', WGSL_COMMON + WGSL_TRACE);
    const mShade = await module('shade', WGSL_COMMON + WGSL_SHADE);
    const mPost = await module('post', WGSL_COMMON + WGSL_POST);
    const mSky = await module('sky', WGSL_SKY);

    const HDRF = 'rgba16float';
    const constBlend = { color: { srcFactor: 'constant', dstFactor: 'one-minus-constant', operation: 'add' },
                         alpha: { srcFactor: 'constant', dstFactor: 'one-minus-constant', operation: 'add' } };
    const rp = (layout, mod, entry, targets) => d.createRenderPipeline({
      layout: pl(layout), vertex: { module: mod, entryPoint: 'vs' },
      fragment: { module: mod, entryPoint: entry, targets }, primitive: { topology: 'triangle-list' } });

    this.pipes = {
      trace: d.createComputePipeline({ layout: pl(this.layouts.trace), compute: { module: mTrace, entryPoint: 'main' } }),
      shade: rp(this.layouts.shade, mShade, 'fsAnimated', [{ format: HDRF }]),
      stat: rp(this.layouts.stat, mShade, 'fsStatic', [{ format: HDRF }, { format: HDRF, blend: constBlend }, { format: HDRF }]),
      resolve: rp(this.layouts.post, mPost, 'fsResolve', [{ format: HDRF }]),
      down: rp(this.layouts.post, mPost, 'fsDown', [{ format: HDRF }]),
      up: rp(this.layouts.post, mPost, 'fsUp', [{ format: HDRF, blend: constBlend }]),
      blit: rp(this.layouts.post, mPost, 'fsBlit', [{ format: HDRF }]),
      composite: rp(this.layouts.post, mPost, 'fsComposite', [{ format: this.canvasFormat }]),
      sky: rp(this.layouts.sky, mSky, 'fs', [{ format: HDRF }]),
    };

    this.ubuf = d.createBuffer({ size: UNIFORM_FLOATS * 4, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
    this.linClamp = d.createSampler({ magFilter: 'linear', minFilter: 'linear', mipmapFilter: 'linear',
      addressModeU: 'clamp-to-edge', addressModeV: 'clamp-to-edge', addressModeW: 'clamp-to-edge' });
    this.linRepeat = d.createSampler({ magFilter: 'linear', minFilter: 'linear', addressModeU: 'repeat', addressModeV: 'repeat', addressModeW: 'repeat' });
    this.dummy = d.createTexture({ size: [1, 1], format: HDRF, usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT }).createView();
    this.lutTex = d.createTexture({ size: [Tables.LUT_N, 2], format: HDRF, usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
    this.lutView = this.lutTex.createView();
  }

  /** Upload the blackbody / flux table (Float32 RGBA, LUT_N × 2). */
  updateLUT(data) {
    this.device.queue.writeTexture({ texture: this.lutTex }, Tables.toHalfArray(data), { bytesPerRow: Tables.LUT_N * 8 }, [Tables.LUT_N, 2]);
  }

  /** Upload the tileable 3D noise volume (r8unorm, size³). */
  setNoise(data, size) {
    const t = this.device.createTexture({ size: [size, size, size], dimension: '3d', format: 'r8unorm',
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.COPY_DST });
    this.device.queue.writeTexture({ texture: t }, data, { bytesPerRow: size, rowsPerImage: size }, [size, size, size]);
    this.noiseView = t.createView();
  }

  /** Render the procedural sky into a mip-mapped cubemap (once; again only if the size changes). */
  buildSky(size) {
    const d = this.device;
    if (this.skyTex) this.skyTex.destroy();
    const mips = Math.floor(Math.log2(size)) + 1;
    this.skyTex = d.createTexture({ size: [size, size, 6], format: 'rgba16float', mipLevelCount: mips,
      usage: GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT });
    this.skySize = size;
    this.skyMaxLod = mips - 1;
    const faceView = (face, level) => this.skyTex.createView({ dimension: '2d', baseArrayLayer: face, arrayLayerCount: 1, baseMipLevel: level, mipLevelCount: 1 });
    const sigma = 0.55 * 2 / size;                      // star PSF: ~half a texel (radians at face centre)
    for (let face = 0; face < 6; face++) {
      const ub = d.createBuffer({ size: 16, usage: GPUBufferUsage.UNIFORM | GPUBufferUsage.COPY_DST });
      d.queue.writeBuffer(ub, 0, new Float32Array([face, size, sigma, 0]));
      const bg = d.createBindGroup({ layout: this.layouts.sky, entries: [
        { binding: 0, resource: { buffer: ub } }, { binding: 1, resource: this.lutView }, { binding: 2, resource: this.linClamp },
        { binding: 3, resource: this.noiseView }, { binding: 4, resource: this.linRepeat }] });
      const enc = d.createCommandEncoder();
      const pass = enc.beginRenderPass({ colorAttachments: [{ view: faceView(face, 0), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
      pass.setPipeline(this.pipes.sky); pass.setBindGroup(0, bg); pass.draw(3); pass.end();
      // Mip chain: successive 2×2 box filters conserve the flux of every star, so
      // minified (demagnified) sky regions dim smoothly instead of shimmering.
      for (let level = 1; level < mips; level++) {
        const bgm = d.createBindGroup({ layout: this.layouts.post, entries: [
          { binding: 0, resource: { buffer: this.ubuf } }, { binding: 1, resource: faceView(face, level - 1) },
          { binding: 2, resource: this.dummy }, { binding: 3, resource: this.linClamp }] });
        const p = enc.beginRenderPass({ colorAttachments: [{ view: faceView(face, level), loadOp: 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
        p.setPipeline(this.pipes.blit); p.setBindGroup(0, bgm); p.draw(3); p.end();
      }
      d.queue.submit([enc.finish()]);
    }
    this.skyView = this.skyTex.createView({ dimension: 'cube' });
    if (this.fullW) this.makeBindGroups();
  }

  /** (Re)allocate the ray caches and render targets. */
  resize(fullW, fullH, lowW, lowH) {
    const d = this.device;
    for (const t of this.owned || []) t.destroy();
    this.owned = [];
    const own = (t) => { this.owned.push(t); return t; };
    this.fullW = fullW; this.fullH = fullH; this.lowW = lowW; this.lowH = lowH;
    const RT = GPUTextureUsage.TEXTURE_BINDING | GPUTextureUsage.RENDER_ATTACHMENT;
    const target = (w, h) => own(d.createTexture({ size: [w, h], format: 'rgba16float', usage: RT })).createView();
    this.cacheFull = own(d.createBuffer({ size: fullW * fullH * 64, usage: GPUBufferUsage.STORAGE }));
    this.cacheLow = own(d.createBuffer({ size: lowW * lowH * 64, usage: GPUBufferUsage.STORAGE }));
    this.s0 = target(fullW, fullH);
    this.sbar = target(fullW, fullH);
    this.skyCache = target(fullW, fullH);
    this.scene = target(fullW, fullH);
    this.hist = [target(fullW, fullH), target(fullW, fullH)];
    this.bloom = [];
    for (let i = 1; i <= BLOOM_LEVELS; i++) this.bloom.push(target(Math.max(1, fullW >> i), Math.max(1, fullH >> i)));
    this.makeBindGroups();
  }

  makeBindGroups() {
    if (!this.skyView || !this.noiseView || !this.cacheFull) return;
    const d = this.device, U = { binding: 0, resource: { buffer: this.ubuf } };
    const common = (cache) => [U, { binding: 1, resource: { buffer: cache } },
      { binding: 2, resource: this.lutView }, { binding: 3, resource: this.linClamp },
      { binding: 4, resource: this.noiseView }, { binding: 5, resource: this.linRepeat }, { binding: 6, resource: this.skyView }];
    const post = (a, b) => d.createBindGroup({ layout: this.layouts.post, entries: [U, { binding: 1, resource: a }, { binding: 2, resource: b || this.dummy }, { binding: 3, resource: this.linClamp }] });
    const shade = (cache) => d.createBindGroup({ layout: this.layouts.shade, entries: [...common(cache), { binding: 7, resource: this.s0 }, { binding: 8, resource: this.sbar }, { binding: 9, resource: this.skyCache }] });
    this.bg = {
      trace: { full: d.createBindGroup({ layout: this.layouts.trace, entries: [U, { binding: 1, resource: { buffer: this.cacheFull } }] }),
               low: d.createBindGroup({ layout: this.layouts.trace, entries: [U, { binding: 1, resource: { buffer: this.cacheLow } }] }) },
      shade: { full: shade(this.cacheFull), low: shade(this.cacheLow) },
      stat: d.createBindGroup({ layout: this.layouts.stat, entries: common(this.cacheFull) }),
      resolve: [post(this.scene, this.hist[1]), post(this.scene, this.hist[0])],          // [i] writes hist[i], reads hist[1−i]
      down: [post(this.hist[0]), post(this.hist[1]), ...this.bloom.slice(0, -1).map((v) => post(v))],
      up: this.bloom.slice(1).map((v) => post(v)),
      composite: [post(this.hist[0], this.bloom[0]), post(this.hist[1], this.bloom[0])],
    };
  }

  /** Encode and submit one frame.
      frame = { u: Float32Array, trace: null | { cache, w, h, y0, y1, staticWeight }, shadeSrc, shadeW, shadeH } */
  render(frame) {
    const d = this.device;
    if (!this.bg) return;
    d.queue.writeBuffer(this.ubuf, 0, frame.u);
    const enc = d.createCommandEncoder();
    const draw = (view, pipe, bg, opts = {}) => {
      const pass = enc.beginRenderPass({ colorAttachments: [{ view, loadOp: opts.load ? 'load' : 'clear', storeOp: 'store', clearValue: [0, 0, 0, 1] }] });
      pass.setPipeline(pipe); pass.setBindGroup(0, bg);
      if (opts.viewport) pass.setViewport(0, 0, opts.viewport[0], opts.viewport[1], 0, 1);
      if (opts.blend !== undefined) pass.setBlendConstant([opts.blend, opts.blend, opts.blend, opts.blend]);
      pass.draw(3); pass.end();
    };

    const t = frame.trace;
    if (t) {
      const pass = enc.beginComputePass();
      pass.setPipeline(this.pipes.trace);
      pass.setBindGroup(0, this.bg.trace[t.cache]);
      pass.dispatchWorkgroups(Math.ceil(t.w / 8), Math.ceil((t.y1 - t.y0) / 8));
      pass.end();
      if (t.staticWeight > 0) {
        const pass2 = enc.beginRenderPass({ colorAttachments: [
          { view: this.s0, loadOp: 'load', storeOp: 'store' }, { view: this.sbar, loadOp: 'load', storeOp: 'store' },
          { view: this.skyCache, loadOp: 'load', storeOp: 'store' }] });
        pass2.setPipeline(this.pipes.stat); pass2.setBindGroup(0, this.bg.stat);
        pass2.setScissorRect(0, t.y0, t.w, t.y1 - t.y0);
        pass2.setBlendConstant([t.staticWeight, t.staticWeight, t.staticWeight, t.staticWeight]);
        pass2.draw(3); pass2.end();
      }
    }

    const hi = this.histIndex;
    draw(this.scene, this.pipes.shade, this.bg.shade[frame.shadeSrc], { viewport: [frame.shadeW, frame.shadeH] });
    draw(this.hist[hi], this.pipes.resolve, this.bg.resolve[hi]);

    // Bloom: downsample chain, then upsample back with equal energy per octave:
    // level i ← (level i + (N−i)·up(level i+1)) / (N−i+1), done with a blend constant.
    const N = BLOOM_LEVELS;
    for (let i = 0; i < N; i++) draw(this.bloom[i], this.pipes.down, i === 0 ? this.bg.down[hi] : this.bg.down[i + 1]);
    for (let i = N - 2; i >= 0; i--) draw(this.bloom[i], this.pipes.up, this.bg.up[i], { load: true, blend: (N - 1 - i) / (N - i) });

    draw(this.context.getCurrentTexture().createView(), this.pipes.composite, this.bg.composite[hi]);
    d.queue.submit([enc.finish()]);
    this.histIndex = 1 - hi;
  }
}

/* ════════════════════════════════════════════════════════════════════════════
   5. WEBGL2 FALLBACK RENDERER
   Same physics and the same ray-cache scheduling, with a simplified frame graph:
     trace (fragment shader → 4 × RGBA32UI targets) → shade → bloom → composite
   SDR only (AgX), no supersampling accumulation and no temporal resolve.
   ════════════════════════════════════════════════════════════════════════════ */
class WebGL2Renderer {
  static create(canvas) {
    const gl = canvas.getContext('webgl2', { antialias: false, alpha: false, depth: false, stencil: false, powerPreference: 'high-performance' });
    if (!gl) throw new Error('WebGL2 is not available');
    if (!gl.getExtension('EXT_color_buffer_float') && !gl.getExtension('EXT_color_buffer_half_float')) throw new Error('float render targets are not supported');
    if (gl.getParameter(gl.MAX_DRAW_BUFFERS) < 4) throw new Error('four draw buffers are required');
    return new WebGL2Renderer(canvas, gl);
  }

  constructor(canvas, gl) {
    this.kind = 'webgl2';
    this.label = 'WebGL2';
    this.supportsSupersample = false;
    this.canvas = canvas;
    this.gl = gl;
    this.hdr = false;
    this.maxTextureSize = Math.min(gl.getParameter(gl.MAX_TEXTURE_SIZE), gl.getParameter(gl.MAX_CUBE_MAP_TEXTURE_SIZE));
    this.maxCachePixels = this.maxTextureSize * this.maxTextureSize;
    this.onError = null;
    // Present in Display-P3 when the browser allows it; otherwise convert to sRGB in the shader.
    this.outMat = new Float32Array([1, 0, 0, 0, 1, 0, 0, 0, 1]);
    if ('drawingBufferColorSpace' in gl) { try { gl.drawingBufferColorSpace = 'display-p3'; } catch (e) { /* keep sRGB */ } }
    if (gl.drawingBufferColorSpace !== 'display-p3') {
      const m = Tables.P3_TO_SRGB;                       // row-major → column-major
      this.outMat = new Float32Array([m[0], m[3], m[6], m[1], m[4], m[7], m[2], m[5], m[8]]);
    }

    const HEAD = '#version 300 es\nprecision highp float;\nprecision highp int;\n';
    const VS = HEAD + 'out vec2 vUV;\nvoid main() {\n  vec2 p = vec2(float((gl_VertexID << 1) & 2), float(gl_VertexID & 2));\n  vUV = p;\n  gl_Position = vec4(p * 2.0 - 1.0, 0.0, 1.0);\n}\n';
    const program = (name, fragment, defines = '') => {
      const compile = (type, src) => {
        const s = gl.createShader(type);
        gl.shaderSource(s, src); gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(`${name} shader: ${gl.getShaderInfoLog(s)}`);
        return s;
      };
      const p = gl.createProgram();
      gl.attachShader(p, compile(gl.VERTEX_SHADER, VS));
      gl.attachShader(p, compile(gl.FRAGMENT_SHADER, HEAD + defines + GLSL_COMMON + '\n' + fragment));
      gl.linkProgram(p);
      if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(`${name} program: ${gl.getProgramInfoLog(p)}`);
      const uniforms = {};
      const n = gl.getProgramParameter(p, gl.ACTIVE_UNIFORMS);
      for (let i = 0; i < n; i++) { const info = gl.getActiveUniform(p, i); uniforms[info.name.replace('[0]', '')] = gl.getUniformLocation(p, info.name); }
      return { p, u: uniforms };
    };
    this.prog = {
      trace: program('trace', GLSL_TRACE),
      shade: program('shade', GLSL_SHADE),
      down: program('bloom-down', GLSL_POST, '#define PASS_DOWN\n'),
      up: program('bloom-up', GLSL_POST, '#define PASS_UP\n'),
      composite: program('composite', GLSL_POST, '#define PASS_COMPOSITE\n'),
      sky: program('sky', GLSL_SKY),
    };
    this.vao = gl.createVertexArray();
    gl.bindVertexArray(this.vao);
    gl.disable(gl.DEPTH_TEST);
    gl.pixelStorei(gl.UNPACK_ALIGNMENT, 1);

    this.lutTex = this.texture(gl.TEXTURE_2D, gl.LINEAR, gl.CLAMP_TO_EDGE);
    gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, Tables.LUT_N, 2);
    this.owned = [];
  }

  texture(target, filter, wrap) {
    const gl = this.gl, t = gl.createTexture();
    gl.bindTexture(target, t);
    gl.texParameteri(target, gl.TEXTURE_MIN_FILTER, filter);
    gl.texParameteri(target, gl.TEXTURE_MAG_FILTER, filter === gl.NEAREST ? gl.NEAREST : gl.LINEAR);
    gl.texParameteri(target, gl.TEXTURE_WRAP_S, wrap);
    gl.texParameteri(target, gl.TEXTURE_WRAP_T, wrap);
    if (target === gl.TEXTURE_3D) gl.texParameteri(target, gl.TEXTURE_WRAP_R, wrap);
    return t;
  }

  setHDR() { return false; }                              // WebGL canvases are SDR

  updateLUT(data) {
    const gl = this.gl;
    gl.bindTexture(gl.TEXTURE_2D, this.lutTex);
    gl.texSubImage2D(gl.TEXTURE_2D, 0, 0, 0, Tables.LUT_N, 2, gl.RGBA, gl.FLOAT, data);
  }

  setNoise(data, size) {
    const gl = this.gl;
    this.noiseTex = this.texture(gl.TEXTURE_3D, gl.LINEAR, gl.REPEAT);
    gl.texStorage3D(gl.TEXTURE_3D, 1, gl.R8, size, size, size);
    gl.texSubImage3D(gl.TEXTURE_3D, 0, 0, 0, 0, size, size, size, gl.RED, gl.UNSIGNED_BYTE, data);
  }

  bind(unit, target, tex, loc) {
    const gl = this.gl;
    gl.activeTexture(gl.TEXTURE0 + unit); gl.bindTexture(target, tex);
    if (loc) gl.uniform1i(loc, unit);
  }

  buildSky(size) {
    const gl = this.gl;
    if (this.skyTex) gl.deleteTexture(this.skyTex);
    const mips = Math.floor(Math.log2(size)) + 1;
    this.skyTex = this.texture(gl.TEXTURE_CUBE_MAP, gl.LINEAR_MIPMAP_LINEAR, gl.CLAMP_TO_EDGE);
    gl.texStorage2D(gl.TEXTURE_CUBE_MAP, mips, gl.RGBA16F, size, size);
    const fbo = gl.createFramebuffer(), pr = this.prog.sky;
    gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
    gl.useProgram(pr.p);
    this.bind(0, gl.TEXTURE_2D, this.lutTex, pr.u.uLut);
    this.bind(1, gl.TEXTURE_3D, this.noiseTex, pr.u.uNoise);
    gl.viewport(0, 0, size, size);
    gl.disable(gl.SCISSOR_TEST); gl.disable(gl.BLEND);
    for (let face = 0; face < 6; face++) {
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_CUBE_MAP_POSITIVE_X + face, this.skyTex, 0);
      gl.uniform4f(pr.u.uFace, face, size, 0.55 * 2 / size, 0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
    gl.deleteFramebuffer(fbo);
    gl.bindTexture(gl.TEXTURE_CUBE_MAP, this.skyTex);
    gl.generateMipmap(gl.TEXTURE_CUBE_MAP);               // box-filtered chain: conserves star flux
  }

  resize(fullW, fullH, lowW, lowH) {
    const gl = this.gl;
    for (const o of this.owned) { if (o.tex) gl.deleteTexture(o.tex); if (o.fbo) gl.deleteFramebuffer(o.fbo); }
    this.owned = [];
    const target = (w, h) => {
      const tex = this.texture(gl.TEXTURE_2D, gl.LINEAR, gl.CLAMP_TO_EDGE);
      gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA16F, w, h);
      const fbo = gl.createFramebuffer();
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, tex, 0);
      const o = { tex, fbo, w, h }; this.owned.push(o); return o;
    };
    const cache = (w, h) => {
      const fbo = gl.createFramebuffer(), tex = [];
      gl.bindFramebuffer(gl.FRAMEBUFFER, fbo);
      for (let i = 0; i < 4; i++) {
        const t = this.texture(gl.TEXTURE_2D, gl.NEAREST, gl.CLAMP_TO_EDGE);
        gl.texStorage2D(gl.TEXTURE_2D, 1, gl.RGBA32UI, w, h);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0 + i, gl.TEXTURE_2D, t, 0);
        tex.push(t); this.owned.push({ tex: t });
      }
      gl.drawBuffers([gl.COLOR_ATTACHMENT0, gl.COLOR_ATTACHMENT1, gl.COLOR_ATTACHMENT2, gl.COLOR_ATTACHMENT3]);
      if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) throw new Error('ray-cache framebuffer is incomplete');
      this.owned.push({ fbo });
      return { fbo, tex, w, h };
    };
    this.fullW = fullW; this.fullH = fullH;
    this.cache = { full: cache(fullW, fullH), low: cache(lowW, lowH) };
    this.scene = target(fullW, fullH);
    this.bloom = [];
    for (let i = 1; i <= BLOOM_LEVELS; i++) this.bloom.push(target(Math.max(1, fullW >> i), Math.max(1, fullH >> i)));
    gl.bindFramebuffer(gl.FRAMEBUFFER, null);
  }

  render(frame) {
    const gl = this.gl;
    if (!this.cache || !this.skyTex) return;
    gl.bindVertexArray(this.vao);
    gl.disable(gl.BLEND);
    const use = (pr) => { gl.useProgram(pr.p); if (pr.u.U) gl.uniform4fv(pr.u.U, frame.u); return pr; };

    const t = frame.trace;
    if (t) {                                              // geodesics → ray cache (one band)
      const c = this.cache[t.cache];
      use(this.prog.trace);
      gl.bindFramebuffer(gl.FRAMEBUFFER, c.fbo);
      gl.viewport(0, 0, t.w, t.h);
      gl.enable(gl.SCISSOR_TEST); gl.scissor(0, t.y0, t.w, t.y1 - t.y0);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
      gl.disable(gl.SCISSOR_TEST);
    }

    {                                                     // ray cache → HDR scene
      const c = this.cache[frame.shadeSrc], pr = use(this.prog.shade);
      gl.bindFramebuffer(gl.FRAMEBUFFER, this.scene.fbo);
      gl.viewport(0, 0, frame.shadeW, frame.shadeH);
      this.bind(0, gl.TEXTURE_2D, c.tex[0], pr.u.uC0); this.bind(1, gl.TEXTURE_2D, c.tex[1], pr.u.uC1);
      this.bind(2, gl.TEXTURE_2D, c.tex[2], pr.u.uC2); this.bind(3, gl.TEXTURE_2D, c.tex[3], pr.u.uC3);
      this.bind(4, gl.TEXTURE_2D, this.lutTex, pr.u.uLut);
      this.bind(5, gl.TEXTURE_3D, this.noiseTex, pr.u.uNoise);
      this.bind(6, gl.TEXTURE_CUBE_MAP, this.skyTex, pr.u.uSkyTex);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }

    const sx = frame.shadeW / this.fullW, sy = frame.shadeH / this.fullH, N = BLOOM_LEVELS;
    {                                                     // bloom: down chain, then equal-energy up chain
      const pr = use(this.prog.down);
      for (let i = 0; i < N; i++) {
        const dst = this.bloom[i], src = i === 0 ? this.scene : this.bloom[i - 1];
        gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo); gl.viewport(0, 0, dst.w, dst.h);
        this.bind(0, gl.TEXTURE_2D, src.tex, pr.u.uTexA);
        gl.uniform2f(pr.u.uUVScale, i === 0 ? sx : 1, i === 0 ? sy : 1);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      const pu = use(this.prog.up);
      gl.enable(gl.BLEND); gl.blendFunc(gl.CONSTANT_COLOR, gl.ONE_MINUS_CONSTANT_COLOR);
      for (let i = N - 2; i >= 0; i--) {
        const dst = this.bloom[i], k = (N - 1 - i) / (N - i);
        gl.bindFramebuffer(gl.FRAMEBUFFER, dst.fbo); gl.viewport(0, 0, dst.w, dst.h);
        gl.blendColor(k, k, k, k);
        this.bind(0, gl.TEXTURE_2D, this.bloom[i + 1].tex, pu.u.uTexA);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }
      gl.disable(gl.BLEND);
    }

    {                                                     // output transform → canvas
      const pr = use(this.prog.composite);
      gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      gl.viewport(0, 0, gl.drawingBufferWidth, gl.drawingBufferHeight);
      this.bind(0, gl.TEXTURE_2D, this.scene.tex, pr.u.uTexA);
      this.bind(1, gl.TEXTURE_2D, this.bloom[0].tex, pr.u.uTexB);
      gl.uniform2f(pr.u.uUVScale, sx, sy);
      gl.uniformMatrix3fv(pr.u.uOutMat, false, this.outMat);
      gl.drawArrays(gl.TRIANGLES, 0, 3);
    }
  }
}

/* ════════════════════════════════════════════════════════════════════════════
   6. APPLICATION
   ════════════════════════════════════════════════════════════════════════════ */
(async function main() {
  const $ = (id) => document.getElementById(id);
  const canvas = $('view');
  const query = new URLSearchParams(location.search);
  const DEG = Math.PI / 180;
  const clamp = (x, lo, hi) => Math.min(hi, Math.max(lo, x));

  /* ── Constants ───────────────────────────────────────────────────────────── */
  const DISK_OUTER = 20;          // disk outer edge [M]
  const R_ESCAPE = 1000;          // rays beyond this radius sample the sky
  const FOV_FAR = 0.30, FOV_NEAR = 0.80;   // tan(fovY/2): ≈ 33° far away, widening to ≈ 77° for close passes
  const TIME_RATE = 7;            // simulation speed: M of coordinate time per second
  const NOISE_PERIOD = 90;        // turbulence cross-fade period [M]
  const NOISE_SIZE = 96, NOISE_CELLS = 16;
  const MOTION_SCALE_MAX = 0.5, MOTION_SCALE_MIN = 0.22;

  /** Quality presets: internal resolution (fraction of device pixels), integrator
      budget, disk detail, number of jittered supersampling passes, sky cubemap size. */
  const QUALITY = {
    low:    { scale: 0.5,  steps: 220, stepQ: 1.5,  layers: 1, octaves: 3, gens: 4,  sky: 1024 },
    medium: { scale: 0.7,  steps: 280, stepQ: 1.25, layers: 2, octaves: 4, gens: 8,  sky: 2048 },
    high:   { scale: 0.85, steps: 340, stepQ: 1.0,  layers: 3, octaves: 4, gens: 12, sky: 2048 },
    ultra:  { scale: 1.0,  steps: 400, stepQ: 1.0,  layers: 3, octaves: 5, gens: 16, sky: 2048 },
  };

  /* ── User-facing parameters ──────────────────────────────────────────────── */
  const P = {
    spin: 0.99,
    tempK: 11500,
    mode: 'cinematic',            // 'cinematic' (gravitational redshift only, weak beaming) | 'physical'
    exposureEV: 0,
    bloom: 0.07,
    hdrPeak: 8,                   // × SDR white
    quality: QUALITY[query.get('quality')] ? query.get('quality') : 'ultra',
    paused: false,
  };

  /* ── Camera: orbit about the hole, always looking at it ──────────────────── */
  // View 1 is the classic framing, 3.5° above the disk plane.  Fitting the whole r ≤ 20 M
  // disk in frame takes a distant camera with a long lens (as for the disk figures of [J15]);
  // from r ≈ 25 M the near rim of the disk would be only 5 M away and far wider than any frame.
  const VIEWS = {
    1: { inc: 86.5, dist: 60 },   // Interstellar
    2: { inc: 0.5,  dist: 70 },   // face-on
    3: { inc: 90,   dist: 60 },   // edge-on
    4: { inc: 81,   dist: 11 },   // close flyby, skimming over the disk
  };
  const cam = { az: 0, inc: VIEWS[1].inc * DEG, dist: VIEWS[1].dist, distTarget: VIEWS[1].dist,
                vAz: 0, vInc: 0, pendAz: 0, pendInc: 0, dragging: false, tween: null };

  function cameraUpdate(dt) {
    let changed = false;
    if (cam.tween) {
      const w = cam.tween;
      w.t = Math.min(1, w.t + dt / w.dur);
      const s = w.t * w.t * w.t * (w.t * (w.t * 6 - 15) + 10);
      cam.az = w.az0 + (w.az1 - w.az0) * s;
      cam.inc = w.inc0 + (w.inc1 - w.inc0) * s;
      cam.dist = Math.exp(Math.log(w.d0) + (Math.log(w.d1) - Math.log(w.d0)) * s);
      cam.distTarget = cam.dist;
      if (w.t >= 1) cam.tween = null;
      return true;
    }
    if (cam.pendAz !== 0 || cam.pendInc !== 0) {
      cam.az += cam.pendAz; cam.inc += cam.pendInc;
      if (dt > 0) {                                       // velocity estimate for inertia
        cam.vAz += (cam.pendAz / dt - cam.vAz) * 0.5;
        cam.vInc += (cam.pendInc / dt - cam.vInc) * 0.5;
      }
      cam.pendAz = cam.pendInc = 0;
      changed = true;
    } else if (cam.dragging) {
      cam.vAz *= 0.6; cam.vInc *= 0.6;
    } else if (Math.abs(cam.vAz) > 2e-3 || Math.abs(cam.vInc) > 2e-3) {
      cam.az += cam.vAz * dt; cam.inc += cam.vInc * dt;
      const decay = Math.exp(-dt * 4.2);
      cam.vAz *= decay; cam.vInc *= decay;
      changed = true;
    } else { cam.vAz = cam.vInc = 0; }
    const ld = Math.log(cam.distTarget / cam.dist);
    if (Math.abs(ld) > 2e-4) { cam.dist *= Math.exp(ld * (1 - Math.exp(-dt * 9))); changed = true; }
    else if (ld !== 0) { cam.dist = cam.distTarget; changed = true; }
    const inc = clamp(cam.inc, 0.3 * DEG, 179.7 * DEG);
    if (inc !== cam.inc) { cam.inc = inc; cam.vInc = 0; }
    return changed;
  }

  function goToView(n) {
    const v = VIEWS[n];
    if (!v) return;
    cam.tween = { t: 0, dur: 2.6, az0: cam.az, az1: cam.az, inc0: cam.inc, inc1: v.inc * DEG, d0: cam.dist, d1: v.dist };
    cam.vAz = cam.vInc = 0;
  }

  /** Field of view: a long lens far away, opening to a wide angle as the camera closes in. */
  function tanHalfFov() {
    const t = clamp((cam.dist - 8) / 32, 0, 1);
    return FOV_NEAR + (FOV_FAR - FOV_NEAR) * t * t * (3 - 2 * t);
  }

  /** Camera position and axes in Kerr–Schild Cartesian coordinates. */
  function cameraFrame() {
    const st = Math.sin(cam.inc), ct = Math.cos(cam.inc), sp = Math.sin(cam.az), cp = Math.cos(cam.az);
    return {
      pos: [cam.dist * st * cp, cam.dist * st * sp, cam.dist * ct],
      fwd: [-st * cp, -st * sp, -ct],
      right: [-sp, cp, 0],
      up: [-ct * cp, -ct * sp, st],
    };
  }

  /* ── Renderer: WebGPU, else WebGL2 ───────────────────────────────────────── */
  let renderer = null;
  const fatal = (msg) => {
    const el = document.createElement('div'); el.id = 'fatal'; el.textContent = msg; document.body.appendChild(el);
  };
  const showNotice = (msg) => { const n = $('notice'); n.textContent = msg; n.hidden = false; };
  let gpuError = null;
  if (query.get('backend') !== 'webgl2') {
    try { renderer = await WebGPURenderer.create(canvas); } catch (e) { gpuError = e; console.warn('WebGPU unavailable:', e); }
  }
  if (!renderer) {
    try {
      const fresh = canvas.cloneNode(false);              // a canvas that was asked for 'webgpu' cannot give 'webgl2'
      canvas.replaceWith(fresh);
      renderer = WebGL2Renderer.create(fresh);
      showNotice((gpuError ? 'WebGPU unavailable: ' : 'Forced by URL: ') + 'WebGL2 fallback (SDR, simplified pipeline)');
    } catch (e) {
      console.error(e);
      fatal('This renderer needs WebGPU (or WebGL2 with float render targets). ' + (gpuError ? gpuError.message : e.message));
      return;
    }
  }
  const view = renderer.canvas;
  renderer.onError = (m) => showNotice(m.length > 140 ? m.slice(0, 140) + '…' : m);

  /* ── HDR detection ───────────────────────────────────────────────────────── */
  const hdrQuery = window.matchMedia('(dynamic-range: high)');
  let hdrOn = false;
  function applyHDR() {
    hdrOn = renderer.setHDR(hdrQuery.matches && query.get('hdr') !== '0');
    const pill = $('hdrPill');
    pill.textContent = hdrOn ? 'HDR on' : 'HDR off';
    pill.classList.toggle('on', hdrOn);
    $('peak').disabled = !hdrOn;
    S.wake = 4;
  }
  hdrQuery.addEventListener('change', applyHDR);

  /* ── Tables and sky ──────────────────────────────────────────────────────── */
  const bh = { a: P.spin, rh: 0, rin: 0, gain: 1 };
  function updateSpin() {
    bh.a = P.spin;
    bh.rh = Kerr.horizon(bh.a);
    bh.rin = Kerr.isco(bh.a);                             // disk inner edge = prograde ISCO [B72]
    const lut = Tables.buildLUT(bh.a, bh.rin, DISK_OUTER);
    bh.gain = lut.gain;
    renderer.updateLUT(lut.data);
  }
  renderer.setNoise(Tables.buildNoise(NOISE_SIZE, NOISE_CELLS), NOISE_SIZE);
  updateSpin();
  let skySize = 0;
  function ensureSky() {
    const want = Math.min(Number(query.get('sky')) || QUALITY[P.quality].sky, renderer.maxTextureSize);
    if (want !== skySize) { skySize = want; renderer.buildSky(want); }
  }
  ensureSky();

  /* ── Geodesic-cache scheduling state ─────────────────────────────────────── */
  // The geodesics depend only on the camera and the spin.  While either changes
  // the whole frame is re-traced every frame at reduced ("motion") resolution.
  // Once they are at rest the full-resolution cache is traced in bands over a
  // few frames, and then re-traced with new sub-pixel jitters to supersample.
  const S = {
    W: 0, H: 0, lowMaxW: 0, lowMaxH: 0,     // internal resolution, motion-cache capacity
    lowW: 0, lowH: 0, lowJit: [0, 0], lowValid: false,
    gen: 0, band: 0, fullReady: false, refineDone: false,
    histValid: false, dirty: true, wake: 0, idle: false, frame: 0, time: 0, prevDist: 1, autoScale: 1,
    cssW: 0, cssH: 0, dpr: 0,
  };
  const perf = { refresh: 1 / 60, samples: [], fallback60: false, motionScale: 0.4, cooldown: 0, missStreak: 0,
                 budget: 0, slowStill: 0, fps: 0, auto: query.get('auto') !== '0' };

  function allocate() {
    const dpr = Math.min(window.devicePixelRatio || 1, 3);
    const cw = Math.max(64, Math.min(renderer.maxTextureSize, Math.round(view.clientWidth * dpr)));
    const ch = Math.max(64, Math.min(renderer.maxTextureSize, Math.round(view.clientHeight * dpr)));
    view.width = cw; view.height = ch;
    S.cssW = view.clientWidth; S.cssH = view.clientHeight; S.dpr = dpr;
    let scale = QUALITY[P.quality].scale * S.autoScale;
    const cap = renderer.maxCachePixels;                  // the ray cache must fit a single buffer
    if (cw * ch * scale * scale > cap) scale = Math.sqrt(cap / (cw * ch)) * 0.999;
    S.W = Math.max(32, Math.round(cw * scale)); S.H = Math.max(32, Math.round(ch * scale));
    S.lowMaxW = Math.ceil(S.W * MOTION_SCALE_MAX); S.lowMaxH = Math.ceil(S.H * MOTION_SCALE_MAX);
    renderer.resize(S.W, S.H, S.lowMaxW, S.lowMaxH);
    S.lowValid = false; S.histValid = false; S.dirty = true; S.wake = 4;
    perf.budget = S.W * S.H / 10;
  }
  applyHDR();
  allocate();
  new ResizeObserver(() => { S.cssW = -1; }).observe(view);

  const halton = (i, b) => { let f = 1, r = 0; while (i > 0) { f /= b; r += f * (i % b); i = Math.floor(i / b); } return r; };

  /* ── Frame-rate governor ─────────────────────────────────────────────────── */
  // Target = display refresh (120 Hz on ProMotion).  If even the smallest motion
  // resolution cannot hold it, the target falls back to half the refresh rate.
  function governor(dt, moving) {
    if (dt <= 0 || dt > 0.25) return;
    perf.fps += (1 / dt - perf.fps) * (perf.fps ? 0.08 : 1);
    perf.samples.push(dt); if (perf.samples.length > 240) perf.samples.shift();
    const sorted = perf.samples.slice().sort((x, y) => x - y);
    perf.refresh = clamp(sorted[Math.floor(sorted.length * 0.05)], 1 / 240, 1 / 24);
    if (!perf.auto) return;
    const target = perf.refresh * (perf.fallback60 ? 2 : 1);
    const miss = dt > target * 1.4;
    if (moving) {
      if (miss) {
        perf.missStreak++;
        if (perf.motionScale <= MOTION_SCALE_MIN && perf.missStreak > 24) perf.fallback60 = true;
        perf.motionScale = Math.max(MOTION_SCALE_MIN, perf.motionScale * 0.86); perf.cooldown = 45;
      } else {
        perf.missStreak = Math.max(0, perf.missStreak - 1);
        if (--perf.cooldown <= 0) perf.motionScale = Math.min(MOTION_SCALE_MAX, perf.motionScale * 1.012);
      }
    } else if (!S.refineDone) {
      perf.budget = miss ? Math.max(S.W * 16, perf.budget * 0.75) : Math.min(S.W * S.H, perf.budget * 1.08);
    } else {
      // At rest with nothing left to trace: if shading alone cannot hold the frame
      // rate, lower the internal resolution one notch.
      perf.slowStill = miss ? perf.slowStill + 1 : Math.max(0, perf.slowStill - 2);
      if (perf.slowStill > 60 && S.autoScale > 0.5) { S.autoScale = Math.max(0.5, S.autoScale * 0.85); perf.slowStill = 0; S.cssW = -1; }
    }
  }

  /* ── Per-frame uniforms ──────────────────────────────────────────────────── */
  const U = new Float32Array(UNIFORM_FLOATS);
  const setU = (i, x, y = 0, z = 0, w = 0) => { U[i * 4] = x; U[i * 4 + 1] = y; U[i * 4 + 2] = z; U[i * 4 + 3] = w; };
  let lastTetrad = null;

  function frame(now) {
    requestAnimationFrame(frame);
    const dtRaw = (now - frame.last) / 1000 || 0;
    frame.last = now;
    const dt = clamp(dtRaw, 0, 0.1);
    if (view.clientWidth !== S.cssW || view.clientHeight !== S.cssH || (window.devicePixelRatio || 1) !== S.dpr && S.dpr < 3) {
      if (view.clientWidth > 0 && view.clientHeight > 0) allocate();
    }

    const moved = cameraUpdate(dt) || S.dirty;
    S.dirty = false;
    // Paused, fully refined and untouched: the image cannot change, so skip the frame entirely.
    if (P.paused && S.refineDone && !moved && S.wake <= 0) {
      if (!S.idle) { S.idle = true; updateReadout(); }
      return;
    }
    S.idle = false;
    S.wake--;
    if (!P.paused) S.time += dt * TIME_RATE;
    S.frame++;
    governor(dtRaw, moved);

    const Q = QUALITY[P.quality];
    const W = S.W, H = S.H;
    const cf = cameraFrame();
    const tet = Kerr.cameraTetrad(bh.a, cf.pos, cf.right, cf.up, cf.fwd);
    lastTetrad = tet;

    /* cache scheduling */
    let trace = null, jit = [0, 0], stepQ = Q.stepQ;
    if (moved || !S.lowValid) {
      S.gen = 0; S.band = 0; S.fullReady = false; S.refineDone = false; S.lowValid = true;
      S.lowW = clamp(Math.round(W * perf.motionScale), 16, S.lowMaxW);
      S.lowH = clamp(Math.round(H * perf.motionScale), 16, S.lowMaxH);
      const k = (S.frame % 16) + 1;
      S.lowJit = jit = [halton(k, 2) - 0.5, halton(k, 3) - 0.5];
      stepQ = Math.max(Q.stepQ, 1.5);                     // coarser steps while moving
      trace = { cache: 'low', w: S.lowW, h: S.lowH, y0: 0, y1: S.lowH, staticWeight: 0 };
    } else if (!S.refineDone) {
      if (S.gen === 0) { S.gen = 1; S.band = 0; }
      const rows = clamp(Math.round(perf.budget / W), 8, H);
      const y0 = S.band, y1 = Math.min(H, y0 + rows);
      if (S.gen > 1) jit = [halton(S.gen, 2) - 0.5, halton(S.gen, 3) - 0.5];
      trace = { cache: 'full', w: W, h: H, y0, y1, staticWeight: renderer.supportsSupersample ? 1 / S.gen : 0 };
      S.band = y1;
      if (y1 >= H) {
        S.fullReady = true; S.gen++; S.band = 0;
        if (S.gen > Q.gens || !renderer.supportsSupersample) S.refineDone = true;
      }
    }

    /* uniforms */
    const tanH = tanHalfFov();
    setU(0, cf.pos[0], cf.pos[1], cf.pos[2], tanH);
    setU(1, tet.e0[1], tet.e0[2], tet.e0[3], tet.e0[0]);
    setU(2, tet.e1[1], tet.e1[2], tet.e1[3], tet.e1[0]);
    setU(3, tet.e2[1], tet.e2[2], tet.e2[3], tet.e2[0]);
    setU(4, tet.e3[1], tet.e3[2], tet.e3[3], tet.e3[0]);
    setU(5, bh.a, bh.rh, bh.rin, DISK_OUTER);
    if (trace) setU(6, trace.w, trace.h, trace.y0, trace.y1);
    setU(7, jit[0], jit[1], Q.steps, W / H);
    setU(8, stepQ, cam.dist, R_ESCAPE);
    const useFull = S.fullReady;
    const sw = useFull ? W : S.lowW, sh = useFull ? H : S.lowH;
    setU(9, sw, sh, S.time, S.frame);
    setU(10, useFull && renderer.supportsSupersample ? 1 : 0, Q.layers, Q.octaves, 1);
    const physical = P.mode === 'physical';
    setU(11, P.tempK, physical ? 1 : 0, physical ? 1 : 0.18, bh.gain);
    setU(12, NOISE_PERIOD, 3.2, 0.035, 0.56);
    setU(13, 1, 2 / skySize, Math.log2(skySize) - 1);
    const base = 1.6;                                     // one exposure for both outputs; the tone curves differ
    setU(14, base * Math.pow(2, P.exposureEV), P.bloom, hdrOn ? P.hdrPeak : 0, 0.012);
    setU(15, 0.55, view.width, view.height);
    const alpha = useFull || !S.histValid ? 1 : 0.34;
    setU(16, alpha, moved ? cam.dist * tanH / S.prevDist : 1, useFull ? 0 : S.lowJit[0], useFull ? 0 : S.lowJit[1]);
    setU(17, sw, sh, W, H);
    setU(18, Tables.T_MIN, Tables.T_MAX, Tables.LUT_N);

    renderer.render({ u: U, trace, shadeSrc: useFull ? 'full' : 'low', shadeW: sw, shadeH: sh });
    S.histValid = true;
    S.prevDist = cam.dist * tanH;                         // apparent size ∝ 1 / (distance · tan(fov/2))
    if ((S.frame & 7) === 0) updateReadout();
  }

  /* ── UI ──────────────────────────────────────────────────────────────────── */
  const markDirty = () => { S.dirty = true; };
  const ui = {
    spin: [$('spin'), $('spinOut'), () => P.spin, (v) => { P.spin = v; updateSpin(); markDirty(); }, (v) => v.toFixed(3)],
    inc: [$('inc'), $('incOut'), () => cam.inc / DEG, (v) => { cam.inc = v * DEG; cam.tween = null; cam.vInc = 0; markDirty(); }, (v) => v.toFixed(1) + '°'],
    temp: [$('temp'), $('tempOut'), () => P.tempK, (v) => { P.tempK = v; markDirty(); }, (v) => Math.round(v).toLocaleString('en-US') + ' K'],
    exposure: [$('exposure'), $('exposureOut'), () => P.exposureEV, (v) => { P.exposureEV = v; S.wake = 4; }, (v) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(2) + ' EV'],
    bloom: [$('bloom'), $('bloomOut'), () => P.bloom, (v) => { P.bloom = v; S.wake = 4; }, (v) => (v * 100).toFixed(1) + ' %'],
    peak: [$('peak'), $('peakOut'), () => P.hdrPeak, (v) => { P.hdrPeak = v; S.wake = 4; }, (v) => v.toFixed(1) + '× white'],
  };
  for (const [input, out, get, set, fmt] of Object.values(ui)) {
    input.value = get(); out.textContent = fmt(get());
    input.addEventListener('input', () => { const v = parseFloat(input.value); set(v); out.textContent = fmt(v); });
  }
  function syncMode() {
    for (const b of $('mode').querySelectorAll('button')) b.setAttribute('aria-pressed', String(b.dataset.mode === P.mode));
  }
  function setMode(m) { P.mode = m; syncMode(); markDirty(); }
  $('mode').addEventListener('click', (e) => { const m = e.target.dataset && e.target.dataset.mode; if (m) setMode(m); });
  syncMode();
  $('quality').value = P.quality;
  $('quality').addEventListener('change', (e) => { P.quality = e.target.value; S.autoScale = 1; ensureSky(); allocate(); });

  function updateReadout() {
    $('roFps').textContent = perf.fps.toFixed(0) + ' fps';
    $('roRes').textContent = `${S.W} × ${S.H}` + (S.fullReady ? '' : ` (tracing ${S.lowW} × ${S.lowH})`);
    $('roState').textContent = !S.fullReady ? 're-tracing' : S.refineDone ? 'cached' + (renderer.supportsSupersample ? ` · ${QUALITY[P.quality].gens}× AA` : '') : `cached · refining ${S.gen - 1}/${QUALITY[P.quality].gens}`;
    $('roBackend').textContent = renderer.label + (hdrOn ? ' · HDR' : ' · SDR');
    if (!cam.dragging && document.activeElement !== ui.inc[0]) {
      ui.inc[0].value = cam.inc / DEG; ui.inc[1].textContent = ui.inc[4](cam.inc / DEG);
    }
    if (!$('debug').hidden) updateLive();
  }

  /* pointer: drag to orbit (with inertia), wheel to dolly */
  let px = 0, py = 0;
  view.addEventListener('pointerdown', (e) => {
    cam.dragging = true; cam.tween = null; cam.vAz = cam.vInc = 0; px = e.clientX; py = e.clientY;
    view.setPointerCapture(e.pointerId); view.classList.add('dragging');
  });
  view.addEventListener('pointermove', (e) => {
    if (!cam.dragging) return;
    cam.pendAz -= (e.clientX - px) * 0.0045; cam.pendInc -= (e.clientY - py) * 0.0045;
    px = e.clientX; py = e.clientY;
  });
  const endDrag = () => { cam.dragging = false; view.classList.remove('dragging'); };
  view.addEventListener('pointerup', endDrag);
  view.addEventListener('pointercancel', endDrag);
  view.addEventListener('wheel', (e) => {
    e.preventDefault();
    cam.tween = null;
    cam.distTarget = clamp(cam.distTarget * Math.exp(e.deltaY * (e.deltaMode === 1 ? 0.04 : 0.0012)), 6, 100);
  }, { passive: false });

  window.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey || e.target.tagName === 'SELECT') return;
    const k = e.key.toLowerCase();
    if (k === 'h') $('panel').hidden = !$('panel').hidden;
    else if (k === 'd') { $('debug').hidden = !$('debug').hidden; if (!$('debug').hidden) { runSelfCheck(); updateLive(); } }
    else if (k === 'm') setMode(P.mode === 'physical' ? 'cinematic' : 'physical');
    else if (k === ' ') { P.paused = !P.paused; S.wake = 4; e.preventDefault(); }
    else if (VIEWS[k]) goToView(k);
    else return;
    $('hint').classList.add('faded');
  });
  setTimeout(() => $('hint').classList.add('faded'), 9000);

  /* ── Accuracy self-check (key D) ─────────────────────────────────────────── */
  // Every "measured" value marked ∫ comes from the same RK4 Kerr–Schild integrator
  // (CPU mirror of the compute shader) launched through the same camera tetrad.
  function testCamera(a, R) {
    return Kerr.cameraTetrad(a, [R, 0, 0], [0, 1, 0], [0, 0, 1], [-1, 0, 0]);   // on the equator, looking at the hole
  }
  /** Bisect the shadow rim along a horizontal screen line at height `beta` (units of M).
      Returns { alpha (screen coordinate × R), b = L_z/E of the marginal ray, rmin }. */
  function shadowRim(a, side, beta, R = 1000) {
    const tet = testCamera(a, R), pos = [R, 0, 0];
    const shoot = (alpha) => {
      const n = [alpha / R, beta / R, 1], l = Math.hypot(n[0], n[1], n[2]);
      const q = Kerr.photonMomentum(tet, n.map((c) => c / l));
      return { q, t: Kerr.trace(a, pos, q, { quality: 0.5, maxSteps: 30000 }) };
    };
    let inside = 0, outside = 14 * side, last = null;
    if (shoot(0).t.fate !== 'horizon') inside = 2.5;               // the shadow shifts toward +α with spin
    for (let i = 0; i < 34; i++) {
      const mid = 0.5 * (inside + outside), s = shoot(mid);
      if (s.t.fate === 'horizon') inside = mid; else { outside = mid; last = s; }
    }
    const q = last.q;
    return { alpha: 0.5 * (inside + outside), b: -(pos[0] * q[2] - pos[1] * q[1]) / q[0], rmin: last.t.rmin };
  }

  let checksDone = false;
  function runSelfCheck() {
    if (checksDone) return;
    checksDone = true;
    setTimeout(() => {
      const rows = [];
      const add = (name, expected, got, tol, digits = 3) => rows.push({ name, expected: expected.toFixed(digits), got: got.toFixed(digits), pass: Math.abs(got - expected) <= tol });
      const flag = (name, expected, got, pass) => rows.push({ name, expected, got, pass });

      // a = 0 (Schwarzschild)
      const s0L = shadowRim(0, -1, 0), s0R = shadowRim(0, +1, 0);
      add('Shadow radius, a = 0  ∫', 3 * Math.sqrt(3), 0.5 * (Math.abs(s0L.b) + Math.abs(s0R.b)), 5e-3);
      add('Photon sphere, a = 0  ∫ (periapsis of marginal ray)', 3, 0.5 * (s0L.rmin + s0R.rmin), 2e-2);
      add('Photon sphere, a = 0  (B72 formula)', 3, Kerr.photonOrbit(0), 1e-9);
      add('ISCO, a = 0  (B72 formula)', 6, Kerr.isco(0), 1e-9);
      // circular-orbit energy E(r) is stationary exactly at the ISCO
      const E = (r, a) => (1 - 2 / r + a * Math.pow(r, -1.5)) / Math.sqrt(1 - 3 / r + 2 * a * Math.pow(r, -1.5));
      const dE = (r, a) => (E(r + 1e-4, a) - E(r - 1e-4, a)) / 2e-4;
      add('dE/dr at r = 6, a = 0  (marginal stability)', 0, dE(6, 0), 1e-6, 7);

      // a = 0.998
      const A = 0.998;
      add('Prograde ISCO, a = 0.998', 1.237, Kerr.isco(A), 1e-3);
      add('dE/dr at the ISCO, a = 0.998', 0, dE(Kerr.isco(A), A), 1e-5, 7);
      const kL = shadowRim(A, -1, 0), kR = shadowRim(A, +1, 0);
      add('Prograde rim b = L/E, a = 0.998  ∫', Kerr.criticalImpact(A, +1), kL.b, 2e-2);
      add('Retrograde rim b = L/E, a = 0.998  ∫', Kerr.criticalImpact(A, -1), kR.b, 2e-2);

      // D-shape: horizontal offset of the shadow and flattening of the prograde side
      const sag = (a) => {
        const l0 = shadowRim(a, -1, 0).alpha, r0 = shadowRim(a, +1, 0).alpha;
        const l1 = shadowRim(a, -1, 2.6).alpha, r1 = shadowRim(a, +1, 2.6).alpha;
        return { offset: 0.5 * (l0 + r0), pro: Math.abs(l1 - l0), retro: Math.abs(r0 - r1) };
      };
      const g0 = sag(0), g5 = sag(0.5), g9 = sag(0.9), gA = sag(A);
      flag('Shadow centre offset: a = 0, 0.5, 0.9, 0.998  ∫', '0, then growing',
        [g0, g5, g9, gA].map((g) => g.offset.toFixed(2)).join(', '),
        Math.abs(g0.offset) < 0.02 && g5.offset > 0.5 && g9.offset > g5.offset && gA.offset > g9.offset);
      flag('Rim sagitta at β = 2.6 M, a = 0 (circle)  ∫', '0.697 both sides', `${g0.pro.toFixed(3)} / ${g0.retro.toFixed(3)}`,
        Math.abs(g0.pro - 0.697) < 0.01 && Math.abs(g0.retro - 0.697) < 0.01);
      flag('D-shape, a = 0.998: prograde side flattened  ∫', 'pro ≪ retro', `${gA.pro.toFixed(3)} / ${gA.retro.toFixed(3)}`, gA.pro < 0.5 * gA.retro);

      // integrator invariants on a strongly lensed ray at the current spin
      {
        const a = bh.a, tet = testCamera(a, 60), n = [0.11, 0.04, 1], l = Math.hypot(...n);
        const q = Kerr.photonMomentum(tet, n.map((c) => c / l));
        const t = Kerr.trace(a, [60, 0, 0], q, { quality: 1, maxSteps: 4000 });
        const s = t.state, Lz0 = 60 * q[2], Lz1 = s[0] * s[4] - s[1] * s[3];
        const g = Kerr.ksMetric(a, s[0], s[1], s[2]);
        // H = ½ g^μν q_μ q_ν via g^μν = η^μν − f l^μ l^ν
        const r = Kerr.ksRadius(a, s[0], s[1], s[2]), Pp = r * r + a * a, f = 2 * r * r * r / (r * r * r * r + a * a * s[2] * s[2]);
        const lq = q[0] + ((r * s[0] - a * s[1]) / Pp) * s[3] + ((r * s[1] + a * s[0]) / Pp) * s[4] + (s[2] / r) * s[5];
        const Hn = 0.5 * (-q[0] * q[0] + s[3] * s[3] + s[4] * s[4] + s[5] * s[5]) - 0.5 * f * lq * lq;
        flag(`Null condition |H| after ${t.steps} steps, a = ${a.toFixed(3)}  ∫`, '< 1e-5', Math.abs(Hn).toExponential(1), Math.abs(Hn) < 1e-5 && g.length === 16);
        flag('L_z drift along the same ray  ∫', '< 1e-5', Math.abs(Lz1 - Lz0).toExponential(1), Math.abs(Lz1 - Lz0) < 1e-5);
      }

      $('checks').innerHTML = rows.map((r) =>
        `<tr><td>${r.name}</td><td>${r.expected}</td><td>${r.got}</td><td class="${r.pass ? 'pass' : 'fail'}">${r.pass ? 'PASS' : 'FAIL'}</td></tr>`).join('');
    }, 30);
  }

  /** Live quantities + analytic shadow rim [Bardeen 1973; B72]:
      spherical photon orbits of radius r have  ξ = −(r³ − 3r² + a²r + a²)/(a(r − 1)),
      η = r³(4a² − r(r − 3)²)/(a²(r − 1)²);  on the sky  α = −ξ/sin i,  β² = η + a²cos²i − ξ²cot²i. */
  function updateLive() {
    const a = bh.a, i = cam.inc;
    const kv = [
      ['spin a', a.toFixed(3)], ['horizon r₊', bh.rh.toFixed(4)], ['ISCO (disk inner edge)', bh.rin.toFixed(4)],
      ['photon orbits (pro / retro)', `${Kerr.photonOrbit(a, 1).toFixed(3)} / ${Kerr.photonOrbit(a, -1).toFixed(3)}`],
      ['camera r, θ', `${cam.dist.toFixed(1)} M, ${(i / DEG).toFixed(1)}°`],
      ['ZAMO ω at camera', lastTetrad ? lastTetrad.omegaZamo.toExponential(2) : '–'],
      ['steps per ray (cap)', String(QUALITY[P.quality].steps)],
      ['internal / canvas', `${S.W}×${S.H} / ${view.width}×${view.height}`],
      ['display refresh', (1 / perf.refresh).toFixed(0) + ' Hz' + (perf.fallback60 ? ' (targeting half)' : '')],
    ];
    $('liveKV').innerHTML = kv.map(([k, v]) => `<span>${k}</span><b>${v}</b>`).join('');
    const pts = [];
    if (a < 1e-3) {
      for (let k = 0; k <= 72; k++) pts.push([5.19615 * Math.cos(k * Math.PI / 36), 5.19615 * Math.sin(k * Math.PI / 36)]);
    } else {
      const r1 = Kerr.photonOrbit(a, 1), r2 = Kerr.photonOrbit(a, -1), si = Math.max(Math.sin(i), 1e-3), ci = Math.cos(i), top = [];
      for (let k = 0; k <= 200; k++) {
        const r = r1 + (r2 - r1) * (0.5 - 0.5 * Math.cos(Math.PI * k / 200));
        const xi = -(r * r * r - 3 * r * r + a * a * r + a * a) / (a * (r - 1));
        const eta = r * r * r * (4 * a * a - r * (r - 3) * (r - 3)) / (a * a * (r - 1) * (r - 1));
        const b2 = eta + a * a * ci * ci - xi * xi * ci * ci / (si * si);
        if (b2 >= 0) top.push([-xi / si, Math.sqrt(b2)]);
      }
      for (const p of top) pts.push(p);
      for (let k = top.length - 1; k >= 0; k--) pts.push([top[k][0], -top[k][1]]);
    }
    const path = pts.map((p, k) => `${k ? 'L' : 'M'}${p[0].toFixed(3)} ${(-p[1]).toFixed(3)}`).join('') + 'Z';
    $('shadowPlot').innerHTML =
      `<path d="M-9 0H9M0 -9V9" stroke="rgba(255,255,255,0.14)" stroke-width="0.06"/>` +
      `<circle r="5.19615" fill="none" stroke="rgba(255,255,255,0.22)" stroke-width="0.06" stroke-dasharray="0.3 0.3"/>` +
      `<path d="${path}" fill="rgba(0,0,0,0.85)" stroke="#ffb86b" stroke-width="0.12"/>`;
  }

  // Handle for the console / automated tests.
  window.gargantua = { params: P, camera: cam, state: S, perf, renderer, markDirty, goToView, runSelfCheck, shadowRim };
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
